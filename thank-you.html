<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow">
<title>Thank you — PIKE SIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --olive:#2F3B26; --olive-deep:#222C1B; --cream:#F2EFE6; --sage:#A8B596; --sage-dk:#8E9C7C;
    --serif:'Noto Serif SC', Georgia, serif; --sans:'Inter', system-ui, sans-serif;
    --mx:clamp(24px,6vw,80px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{position:relative;min-height:100svh;background:var(--olive-deep);color:var(--cream);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;align-items:center;
    justify-content:center;text-align:center;padding:48px var(--mx);line-height:1.6;overflow:hidden}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}

  /* full-bleed studio background (crossfading), same treatment as the studio section */
  .ty-bg{position:absolute;inset:0;z-index:0}
  .ty-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.5)}
  .ty-bg .ty-top{opacity:0;will-change:opacity;transition:opacity 1.5s ease-in-out}
  .ty-bg .ty-top.show{opacity:1}
  .ty-bg::after{content:"";position:absolute;inset:0;z-index:1;background:
    radial-gradient(120% 100% at 50% 45%, rgba(16,20,12,.35) 0%, rgba(16,20,12,.72) 100%)}

  .ty{position:relative;z-index:2;max-width:600px}
  .mark{height:34px;width:auto;margin:0 auto 40px;opacity:.95}
  .eyebrow{font-family:var(--sans);font-weight:500;font-size:.72rem;letter-spacing:.32em;
    text-transform:uppercase;color:var(--sage);display:block;margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.8rem,8vw,4.6rem);
    line-height:1.05;color:var(--cream);margin-bottom:22px}
  h1 em{font-style:italic;color:var(--sage)}
  p{max-width:44ch;margin:0 auto 16px;font-weight:300;color:var(--cream);opacity:.94;
    font-size:clamp(1rem,1.5vw,1.14rem);text-shadow:0 1px 24px rgba(16,20,12,.5)}
  .cta{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .btn{font-family:var(--sans);font-weight:500;font-size:.78rem;letter-spacing:.14em;
    text-transform:uppercase;padding:14px 26px;border-radius:2px;transition:.25s;
    border:1px solid transparent;display:inline-block;cursor:pointer}
  .btn-primary{background:var(--sage);color:var(--olive-deep)}
  .btn-primary:hover{background:var(--cream)}
  .btn-ghost{border-color:var(--sage);color:var(--cream)}
  .btn-ghost:hover{background:var(--sage);color:var(--olive-deep)}
</style>
</head>
<body>
  <div class="ty-bg">
    <img class="ty-base" src="assets/studio-vault.jpg" alt="Inside the PIKE SIX studio in Singapore">
    <img class="ty-top" src="assets/studio-rows.jpg" alt="">
  </div>

  <div class="ty">
    <img class="mark" src="assets/pikesix-wordmark.png" alt="PIKE SIX">
    <span class="eyebrow">You're on the list</span>
    <h1>Thank <em>you.</em></h1>
    <p>Your details are in, and you're in line for the founding 100. Our team will be in touch shortly to secure your slot — payment confirms your place, on a first-paid basis.</p>
    <p>Keep an eye on your phone and email.</p>
    <div class="cta">
      <a class="btn btn-primary" href="https://wa.me/6580796919?text=Hi%20PIKE%20SIX%2C%20I%20just%20registered%20for%20the%20founding%20100%20and%20would%20like%20to%20secure%20my%20slot.">Message us on WhatsApp</a>
      <a class="btn btn-ghost" href="index.html">Back to site</a>
    </div>
  </div>

  <!-- CONVERSION TRACKING (Tyler): fire Google Ads + Meta 'Lead' conversion on this page load.
       This is the dedicated thank-you URL for tracking. Add the gtag/fbq conversion snippets here. -->
  <script>
    (function(){
      var bg=document.querySelector('.ty-bg'); if(!bg)return;
      var base=bg.querySelector('.ty-base'), top=bg.querySelector('.ty-top');
      var SRC=['assets/studio-vault.jpg','assets/studio-rows.jpg','assets/studio-lockers.jpg'];
      var i=0, RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      SRC.forEach(function(s){ var im=new Image(); im.src=s; });
      function snap(){ top.style.transition='none'; top.classList.remove('show'); void top.offsetWidth; top.style.transition=''; }
      function next(){
        var n=(i+1)%SRC.length;
        top.src=SRC[n]; snap();
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ top.classList.add('show'); }); });
        setTimeout(function(){ i=n; base.src=SRC[i]; snap(); }, 1500);
      }
      base.src=SRC[0];
      if(!RM){ setInterval(next, 3000); }
    })();
  </script>
</body>
</html>
